<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/brand/lexivia-compact.svg?v=classic" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>lexivia</title>
    <script>
      try {
        const language = localStorage.getItem('lexivia-language');
        document.documentElement.lang = ['en', 'fr', 'ar'].includes(language) ? language : 'en';
        document.documentElement.dir = language === 'ar' ? 'rtl' : 'ltr';
      } catch { document.documentElement.lang = 'en'; document.documentElement.dir = 'ltr'; }
    </script>
    <script>
      // Apply before React and CSS load to avoid flashing the wrong theme.
      try {
        const theme = localStorage.getItem('lexivia-theme');
        document.documentElement.dataset.theme = theme === 'dark' || (theme === 'system' && matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
      } catch { document.documentElement.dataset.theme = 'light'; }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
